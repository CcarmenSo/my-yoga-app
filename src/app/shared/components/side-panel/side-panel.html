<div class="drawer lg:drawer-open bg-base-100 p-4">
  <input id="my-drawer-3" type="checkbox" class="drawer-toggle" />
  <div class="drawer-content flex flex-col items-center justify-center">
    <label for="my-drawer-3" class="btn drawer-button lg:hidden ">
      Categories:
    </label>
  </div>
  <div class="drawer-side border border-gray-500">
    <label for="my-drawer-3" aria-label="close sidebar" class="drawer-overlay"></label>
    <p class = "m-5">Categories:</p>
    <ul class="menu bg-base-400 min-h-full w-80 p-4">

      @for(category of arrayCategories(); track $index){
      <li>
        <label class="label">
          <input type="radio" name="radio-5" class="radio radio-secondary" checked="checked" [value]="category" (change)="onRadioButtonChange($event)"/>
          {{category}}
        </label>
      </li>
      }
